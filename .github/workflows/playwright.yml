

name: Playwright Tests

on:
  # schedule:
  #   - cron: '30 21 * * 1-4'  # Mon-Fri 8PM IST
  # push:
  #   branches: [main]
  # pull_request:
  #   branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Select environment'
        required: true
        default: 'QA'
        type: choice
        options:
          - QA
          - stage
          - dev

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ github.event.inputs.environment || 'QA' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS deps only (if cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # reportingLabs run history: powers the Trend chart, new vs known
      # failures, flaky dots and "got slower". One history per environment.
      - name: Restore reportingLabs history
        uses: actions/cache@v4
        with:
          path: reporting-labs.history.json
          key: reporting-labs-history-${{ github.event.inputs.environment || 'QA' }}-${{ github.run_id }}
          restore-keys: reporting-labs-history-${{ github.event.inputs.environment || 'QA' }}-

      - name: Run tests
        run: npx playwright test --project=chromium
        env:
          ENV: ${{ github.event.inputs.environment || 'QA' }}
          BASE_URL: ${{ secrets.BASE_URL }}
          USER_NAME: ${{ secrets.USERNAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
          OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
          OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
          OAUTH_GRANT_TYPE: ${{ secrets.OAUTH_GRANT_TYPE}}
          API_BASE_URL_BOOKING: ${{ secrets.API_BASE_URL_BOOKING }}

     
    # Step 2: Install Allure CLI globally on the runner environment
      - name: Install Allure CLI
        if: always()
        run: npm install -g allure-commandline --save-dev

    # Step 3: Bundle results into a single index.html file
      - name: Generate Single File Report
        if: always()
        run: allure generate --single-file allure-results --clean -o allure-report
        # Step 4: Archive the output directory
      - name: Upload Allure HTML Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
        name: standalone-allure-report
        path: allure-report/ 